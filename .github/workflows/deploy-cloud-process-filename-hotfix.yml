name: Deploy processor filename-contract hotfix

on:
  push:
    branches:
      - main
    paths:
      - cloud-process-hotfix/**
      - .github/workflows/deploy-cloud-process-filename-hotfix.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production-cloud-process
  cancel-in-progress: false

env:
  PROJECT_ID: pothole-warrior-upload
  REGION: europe-west2
  JOB: phw-cloud-process
  BASE_IMAGE: gcr.io/pothole-warrior-upload/phw-cloud-process:persist-affected-tiles-20260717t111304z
  HOTFIX_IMAGE: gcr.io/pothole-warrior-upload/phw-cloud-process:filename-contract-hotfix-20260824

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pothole-warrior-upload
          workload_identity_provider: projects/268947036447/locations/global/workloadIdentityPools/github-actions/providers/phw-map-viewer
          service_account: phw-map-deployer@pothole-warrior-upload.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify production base image
        shell: bash
        run: |
          set -euo pipefail
          current_image="$(gcloud run jobs describe "$JOB"             --project="$PROJECT_ID"             --region="$REGION"             --format='value(spec.template.spec.template.spec.containers[0].image)')"
          echo "Current image: $current_image"
          test "$current_image" = "$BASE_IMAGE"

      - name: Build and push hotfix image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker gcr.io --quiet
          docker build --pull --tag "$HOTFIX_IMAGE" cloud-process-hotfix
          docker push "$HOTFIX_IMAGE"

      - name: Update production processor job
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs update "$JOB"             --project="$PROJECT_ID"             --region="$REGION"             --image="$HOTFIX_IMAGE"

      - name: Execute one controlled processor run
        shell: bash
        run: |
          set -euo pipefail
          if ! gcloud run jobs execute "$JOB"             --project="$PROJECT_ID"             --region="$REGION"             --wait; then
            echo "Controlled run failed; restoring previous production image."
            gcloud run jobs update "$JOB"               --project="$PROJECT_ID"               --region="$REGION"               --image="$BASE_IMAGE"
            exit 1
          fi

      - name: Verify deployed image
        shell: bash
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run jobs describe "$JOB"             --project="$PROJECT_ID"             --region="$REGION"             --format='value(spec.template.spec.template.spec.containers[0].image)')"
          echo "Deployed image: $deployed_image"
          test "$deployed_image" = "$HOTFIX_IMAGE"

      - name: Capture processor application log
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs logs read "$JOB"             --project="$PROJECT_ID"             --region="$REGION"             --freshness=30m             --limit=5000             --order=desc             --log-filter='logName="projects/pothole-warrior-upload/logs/run.googleapis.com%2Fstdout"'             | tee processor-hotfix.log
          grep -Fq "Normalizing transitional raw filename:" processor-hotfix.log
