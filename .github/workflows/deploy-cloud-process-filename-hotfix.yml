name: Manual processor filename-contract recovery

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RECOVER to run three processor batches and publish production
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production-cloud-process
  cancel-in-progress: false

env:
  PROJECT_ID: pothole-warrior-upload
  REGION: europe-west2
  JOB: phw-cloud-process
  PUBLISH_JOB: phw-cloud-publish
  BASE_IMAGE: gcr.io/pothole-warrior-upload/phw-cloud-process:persist-affected-tiles-20260717t111304z
  HOTFIX_IMAGE: gcr.io/pothole-warrior-upload/phw-cloud-process:filename-contract-hotfix-20260824

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'RECOVER' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: pothole-warrior-upload
          workload_identity_provider: projects/268947036447/locations/global/workloadIdentityPools/github-actions/providers/phw-map-viewer
          service_account: phw-map-deployer@pothole-warrior-upload.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify production processor image
        shell: bash
        run: |
          set -euo pipefail
          current_image="$(gcloud run jobs describe "$JOB" --project="$PROJECT_ID" --region="$REGION" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          echo "Current image: $current_image"
          if [[ "$current_image" != "$BASE_IMAGE" && "$current_image" != "$HOTFIX_IMAGE" ]]; then
            echo "Unexpected production image; refusing to continue."
            exit 1
          fi

      - name: Build and push hotfix image
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth configure-docker gcr.io --quiet
          docker build --pull --tag "$HOTFIX_IMAGE" cloud-process-hotfix
          docker push "$HOTFIX_IMAGE"

      - name: Ensure hotfix image is deployed
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs update "$JOB" --project="$PROJECT_ID" --region="$REGION" --image="$HOTFIX_IMAGE"

      - name: Drain remaining processor backlog
        shell: bash
        run: |
          set -euo pipefail
          for batch in 2 3 4; do
            echo "Executing recovery batch $batch of 4"
            gcloud run jobs execute "$JOB" --project="$PROJECT_ID" --region="$REGION" --wait
          done

      - name: Verify deployed processor image
        shell: bash
        run: |
          set -euo pipefail
          deployed_image="$(gcloud run jobs describe "$JOB" --project="$PROJECT_ID" --region="$REGION" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          echo "Deployed image: $deployed_image"
          test "$deployed_image" = "$HOTFIX_IMAGE"

      - name: Publish refreshed map
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs execute "$PUBLISH_JOB" --project="$PROJECT_ID" --region="$REGION" --wait

      - name: Capture recovery logs
        shell: bash
        run: |
          set -euo pipefail
          gcloud run jobs logs read "$JOB" --project="$PROJECT_ID" --region="$REGION" --freshness=1h --limit=10000 --order=desc --log-filter='logName="projects/pothole-warrior-upload/logs/run.googleapis.com%2Fstdout"' > processor-recovery.log
          gcloud run jobs logs read "$PUBLISH_JOB" --project="$PROJECT_ID" --region="$REGION" --freshness=1h --limit=5000 --order=desc --log-filter='logName="projects/pothole-warrior-upload/logs/run.googleapis.com%2Fstdout"' > publisher-recovery.log
          tail -n 400 processor-recovery.log
          tail -n 300 publisher-recovery.log
